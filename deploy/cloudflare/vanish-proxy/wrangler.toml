# ============================================================================
# vanish-proxy — serves the Vanish app at justintmccain.com/vanish
# ============================================================================
#
#   npx wrangler deploy          (from this directory)
#
# Prerequisites, in order:
#   1. justintmccain.com is an active zone on this Cloudflare account, and the
#      record for the apex is PROXIED (orange cloud). A DNS-only record means
#      requests never reach Cloudflare's network and this route never fires.
#   2. Vanish is deployed on Netlify with NEXT_PUBLIC_BASE_PATH=/vanish, so it
#      answers at <site>.netlify.app/vanish. Confirm that URL loads BEFORE
#      pointing the proxy at it — debugging a broken app through a proxy is
#      considerably harder than debugging it directly.
#   3. VANISH_ORIGIN below is set to that Netlify origin.

name = "vanish-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-08"

# Both patterns are required. "/vanish" is the canonical URL of the app itself
# (Next uses trailingSlash:false, so the home route has no slash) and "/vanish/*"
# covers every asset and sub-route. A single "/vanish/*" pattern would leave the
# tool's own front door unrouted, which is the one URL people will actually type.
[[routes]]
  pattern = "justintmccain.com/vanish"
  zone_name = "justintmccain.com"

[[routes]]
  pattern = "justintmccain.com/vanish/*"
  zone_name = "justintmccain.com"

[vars]
  # REPLACE THIS with the real Netlify origin, no trailing slash and no path.
  # A custom Netlify domain works equally well; what matters is that the origin
  # serves the app under /vanish.
  VANISH_ORIGIN = "https://REPLACE-ME.netlify.app"

# Deliberately absent, and all four are load-bearing rather than oversights:
#
#   [observability]  — Worker logs. This Worker sits in front of an endpoint
#                      that receives names and addresses in a POST body. No
#                      log sink goes here.
#   [[analytics_engine_datasets]] — same reason.
#   [placement]      — smart placement moves execution nearer the origin, which
#                      is a latency optimisation this does not need and which
#                      changes where requests are processed.
#   [[kv_namespaces]] / [[d1_databases]] — nothing about this proxy should be
#                      able to persist anything. Vanish's promise is that
#                      closing the tab is the purge; give it no storage to
#                      contradict that.
