<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG composer — 1200×630</title>
<!--
  Renders the Open Graph share card to spec (brand/03 §OG image spec).
  Not shipped to visitors; it exists so the card can be regenerated with the
  real self-hosted brand fonts instead of approximated in an image editor.

  To regenerate: serve the site, open /og/compose.html at exactly 1200×630,
  screenshot, and save as og/og-image.png.
-->
<style>
  @font-face { font-family:"Space Grotesk"; src:url("../site/assets/fonts/space-grotesk-var.woff2") format("woff2-variations"); font-weight:400 700; font-display:block; }
  @font-face { font-family:"IBM Plex Mono"; src:url("../site/assets/fonts/plex-mono-400.woff2") format("woff2"); font-weight:400; font-display:block; }
  @font-face { font-family:"IBM Plex Mono"; src:url("../site/assets/fonts/plex-mono-500.woff2") format("woff2"); font-weight:500; font-display:block; }

  * { box-sizing:border-box; margin:0; }
  html,body { background:#0A0F14; }
  body { width:1200px; height:630px; overflow:hidden; }

  .card {
    position:relative; width:1200px; height:630px;
    background:#0A0F14; overflow:hidden;
  }
  .plate {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;
  }
  /* Keep the left third calm and near-black so the wordmark always reads,
     even as a small timeline thumbnail. */
  .scrim {
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, #0A0F14 22%, rgba(10,15,20,0.82) 42%, rgba(10,15,20,0.25) 68%, rgba(10,15,20,0.05) 100%),
      linear-gradient(0deg, rgba(10,15,20,0.55), transparent 45%);
  }
  .content {
    position:absolute; inset:0;
    padding:74px 72px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .mark { display:flex; align-items:center; gap:12px; }
  .mark svg { display:block; }

  .name {
    font-family:"Space Grotesk", sans-serif;
    font-weight:500; font-size:64px; line-height:1.04;
    letter-spacing:-0.02em; color:#EEF2F6;
    max-width:640px;
  }
  .name .dot { color:#E9B44C; }
  .role {
    font-family:"IBM Plex Mono", monospace;
    font-size:22px; letter-spacing:0.08em; text-transform:uppercase;
    color:#A6B2BF; margin-top:20px;
  }
  .chip {
    display:inline-flex; align-items:center; gap:14px;
    font-family:"IBM Plex Mono", monospace;
    font-size:22px; letter-spacing:0.01em;
    color:#E9B44C;
    border-left:2px solid #E9B44C;
    padding:6px 0 6px 18px;
  }
  .node { width:11px; height:11px; border-radius:50%; background:#E9B44C; flex:none; }
</style>
</head>
<body>
  <div class="card">
    <img class="plate" src="og-base.webp" alt="">
    <div class="scrim"></div>
    <div class="content">
      <div class="mark">
        <svg width="112" height="34" viewBox="0 0 62 20" aria-hidden="true">
          <text x="0" y="14" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="500" letter-spacing="1.2" fill="#EEF2F6">JTM</text>
          <line x1="0" y1="17.5" x2="49" y2="17.5" stroke="#5FE3C4" stroke-width="1.25"/>
          <circle cx="54" cy="17.5" r="3.2" fill="#E9B44C"/>
        </svg>
      </div>

      <div>
        <h1 class="name">Justin T. McCain<span class="dot">.</span></h1>
        <p class="role">Privacy Product Leader</p>
      </div>

      <!-- Outcome only. Text baked into an image cannot be revised by editing a
           string, and this card renders in every link preview, so the disclosure
           rules in brand/01 §2 apply here more strictly than anywhere else.
           No percentages, no account counts, no scope-of-problem figures. -->
      <p class="chip"><span class="node"></span> ~$1.75M/yr recovered</p>
    </div>
  </div>
</body>
</html>
