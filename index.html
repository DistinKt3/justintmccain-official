<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0f14" />
    <meta
      name="description"
      content="See what your photos say about you, then strip it. Nothing leaves your browser."
    />
    <!--
      Node at the gate: a node still carrying metadata approaches the
      threshold, and what comes out the other side is hollow. Same primitive
      as the wordmark. Inline data URI so the icon costs no request and needs
      no img-src exception beyond the `data:` already in the CSP.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0f14'/%3E%3Ccircle cx='9' cy='16' r='3.4' fill='%235fe3c4'/%3E%3Cline x1='18' y1='7' x2='18' y2='25' stroke='%23212b35' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='25.5' cy='16' r='2.6' fill='none' stroke='%235fe3c4' stroke-width='1.8'/%3E%3C/svg%3E"
    />
    <title>Metadata Scrubber</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
