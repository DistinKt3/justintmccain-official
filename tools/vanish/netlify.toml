# Netlify build config.
#
# Vanish is NOT a static site. /api/scan is a server function, so there is no
# folder to drag and drop. Netlify's Next.js runtime (the OpenNext adapter,
# @netlify/plugin-nextjs v5) turns that route into a server function during the
# build and wires up routing for everything else.
#
# ---------------------------------------------------------------------------
# WHY THE PLUGIN IS DECLARED EXPLICITLY, AND WHY `publish` IS NOT SET
# ---------------------------------------------------------------------------
# An earlier version of this file did the opposite of both, on the reasoning
# that Netlify auto-detects Next.js and that declaring the plugin yourself can
# pin an older runtime. That reasoning produced a broken deploy, so it is
# recorded here rather than quietly replaced.
#
# What happened: `publish = ".next"` told Netlify the site was a pile of static
# files whose output directory happened to be `.next`. Netlify believed it. The
# build succeeded, the adapter never ran, and the deploy served the RAW CONTENTS
# of the .next directory at the site root — /BUILD_ID, /routes-manifest.json,
# /server/app/index.html and /package.json all returned 200, while every real
# route returned 404 and /.netlify/functions/___netlify-server-handler did not
# exist. Publicly readable build internals and a completely non-functional app,
# from a build that reported success.
#
# So:
#   - The plugin is DECLARED. Declaring it in [[plugins]] is not the same as
#     installing it as a dependency — that is the thing Netlify warns against.
#     Declared here, Netlify supplies and updates the runtime itself, and the
#     build no longer depends on framework auto-detection firing correctly
#     inside a monorepo with a base directory.
#   - `publish` is NOT set. The runtime computes it. Setting it by hand is what
#     caused the failure above, and any value written here will either be
#     ignored or break the deploy again.
#
# If you must debug this, the single fastest check is:
#     curl -s -o /dev/null -w '%{http_code}' <site>/.netlify/functions/___netlify-server-handler
# A 404 there means the adapter did not run, whatever the build log says.
#
# ---------------------------------------------------------------------------
# Security headers deliberately live in next.config.ts, not here. One source of
# truth avoids two CSP headers reaching the browser, where they get intersected
# and fail in ways that are miserable to debug. A missing CSP on a response is
# also a useful symptom: it means the request never went through Next at all.

[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 requires >= 20.9. Pinned so a change to Netlify's default can't
  # quietly move the runtime under a privacy tool.
  NODE_VERSION = "22"

  # Vanish is served at justintmccain.com/vanish, not at a domain root, so every
  # bundle URL and every route must carry that prefix. next.config.ts reads this
  # into `basePath` and re-exports it for the one fetch() Next does not rewrite.
  #
  # This makes the Netlify URL serve the app at <site>.netlify.app/vanish too,
  # which is intentional: the proxy can then forward the path through unchanged
  # instead of rewriting it, so what you test on Netlify is what visitors get.
  #
  # The value is inlined into the client bundle at build time. Changing it needs
  # a REBUILD — clearing the Netlify cache and redeploying is not enough.
  NEXT_PUBLIC_BASE_PATH = "/vanish"

# Netlify supplies and updates this runtime; it is not an npm dependency of the
# project and must not be added to package.json.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# There are no environment variables and no secrets. If this app ever needs one,
# it belongs in Netlify's env UI, never in this file.
#
# Do not enable Netlify Analytics here or in the dashboard, and do not add an
# error monitor. The zero-log promise is the product, not a setting.
